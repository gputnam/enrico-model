# Closed-loop prediction config (orchestrate/): MINERvA ME FHC numu on CH with the *measurement*
# flux, i.e. the data-POT-weighted, nu-e-constrained CV flux that measurement/ divides by
# (exported with `python -m xsec.export_flux`, 0-100 GeV).  Model predictions made with this
# config are directly comparable to the measured cross sections (see measurement/xsec/xsec/genpred.py).
#
# The theorist edits the `channels`/`fsi` sections (or adds code) to change the model; keep the
# run/beam/target sections fixed so predictions stay comparable across iterations.
run:
  events: 2000000
  seed: 20261020
  threads: 16
  output: minerva_me_fhc_numu_CH_loop.root

beam:
  pdg: 14
  flux:
    type: histogram
    format: csv
    file: data/flux/minerva_me_fhc_measurement/flux_pdg14.csv
    density: per_GeV
    units: nu/m^2/POT
    emin: 0.0
    emax: 100.0

target: "1000060120:1,1000010010:1"

channels:
  # CCQE on 12C with a realistic ground state: shell-model spectral function (HO 1s/1p orbitals with the
  # cascade's density, (e,e'p) removal-energy distributions, 20% short-range-correlated np-dominated
  # pairs whose partner is emitted), local Pauli blocking, interaction point handed to the cascade.
  # theory/spectral_function.md. Valencia RPA (theory/local_fermi_gas.md, `rpa: true`) is implemented
  # but off: on top of the SF it over-suppresses ccinc_eavail_q3 at low Eavail (step-17 report).
  - type: CCQE
    nuclear_model: {type: SF}
    form_factors: {vector: BBBA05, axial: dipole, MA: 1.03}
    rpa: false
  # Delta(1232)-region single-pion production: HNV model (Delta pole + crossed Delta + chiral
  # background), C5A(0) = 1.00, M_A^Delta = 0.93 GeV (fit IV of arXiv:1001.4416), W < 1.6 GeV.
  - type: CCRES
    nuclear_model: {type: RFG}
    delta: {C5A0: 1.00, MA: 0.93}
    background: true
    nucleon_form_factors: {vector: dipole, axial: dipole, gA: 1.26, MA: 1.05}
    w_max: 1.6
  # I = 1/2 resonances of the second resonance region (nu n -> l- R+): N(1440) P11, N(1520) D13,
  # N(1535) S11 with the Lalakulich-Paschos-Piranishvili (PRD 74, 014009) vector form factors from
  # electroproduction helicity amplitudes and PCAC axial couplings; incoherent Breit-Wigners, decays to
  # N pi, N eta, N pi pi; W < 1.6 GeV. theory/nstar.md.
  - type: CCNSTAR
    nuclear_model: {type: RFG}
    w_max: 1.6
  # Inclusive shallow/deep-inelastic scattering above the CCRES region (W > 1.6 GeV): Bodek-Yang
  # effective-LO structure functions (GRV98 LO, xi_w, K factors; arXiv:1011.6592 Table 2 + type II
  # axial), hadronized into a nucleon + pions (bubble-chamber multiplicities). theory/dis.md.
  # Single-pion final states of the continuum: isospin-decomposed and scaled by R_3/2 = 0.28 +- 0.15,
  # R_1/2 = 0.68 +- 0.11 from a fit to the ANL/BNL deuterium p pi+, n pi+, p pi0 cross sections
  # (Wilkinson et al. 2014 reanalysis) with CCRES + CCNSTAR; the remaining strength goes to >= 2 pions
  # (inclusive cross section unchanged). theory/dis.md section 3.
  - type: CCDIS
    nuclear_model: {type: RFG}
    w_min: 1.6
    single_pion: {scale_i32: 0.28, scale_i12: 0.68, isospin: true}
  # 2p2h (np -> pp, nn -> np) from relativistic meson-exchange currents (seagull, pion-in-flight,
  # pion-pole, Delta forward/backward; vector + axial) in the RFG: Ruiz Simo et al., J. Phys. G 44,
  # 065105 (2017) [arXiv:1604.08423], real part of the Delta propagator, De Pace et al. (2003) strong
  # form factors; N-Delta axial vertex as CCRES. No q3 cutoff. theory/mec.md.
  - type: CCMEC
    nuclear_model: {type: RFG}
    mec: {C5A0: 1.00, MA: 0.93, C3V0: 2.13, MV: 0.84, f_star: 2.13, delta_propagator: real,
          lambda_piNN: 1.3, lambda_piNDelta: 1.15}

  # CC coherent pion production on 12C, nu A -> mu- pi+ A(g.s.) (process 100): Berger-Sehgal PCAC model
  # (PRD 79, 053003 (2009)) with the Adler/Kopeliovich-Marage lepton-mass (pion-pole) correction,
  # f_pi = 130.7 MeV, m_A = 0.95 GeV. pi-12C elastic dsigma/dt: BS09 fit to the pion-carbon data below
  # T_pi = 0.87 GeV; above, a Glauber multiple-scattering amplitude (12C HO density from electron scattering,
  # PDG isoscalar pi N sigma_tot/sigma_el incl. the N* region, Regge-analyticity Re/Im), blended over
  # 0.87-0.97 GeV. The pion is not passed through the cascade (absorption is in the elastic amplitude).
  # Not applied to hydrogen. theory/coherent_pion.md.
  - type: CCCOH
    f_pi: 0.1307
    mA: 0.95
    lepton_mass_correction: true
    elastic: {model: glauber, table_max_T: 0.87, blend_width: 0.1}

# Semi-classical intranuclear cascade (theory/fsi_cascade.md): vertex from the 12C HO point density,
# local Fermi gas Pauli blocking, nucleon potential T_F(r) + S_N; free pp/np cross sections (Cugnon et al.
# 1996) incl. NN -> N Delta; pions in the Delta-hole model with the Oset-Salcedo (1987) in-medium width
# (QE, CX, 2- and 3-body absorption); SKAT formation length (mu^2 = 0.08 GeV^2) for DIS hadrons.
# No parameter is tuned to the corpus.
fsi: {type: cascade}
